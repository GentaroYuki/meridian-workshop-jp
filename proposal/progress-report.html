        color: #9b9a92;

        gap: 14px;

      p {

        color: var(--ink2);

        gap: 14px;
        margin: 26px 0 8px;

      }
      .stat.c {

      }

        border-top-color: var(--sky);
      }
      .stat.m {
        border-top-color: var(--mineral);
      }
      .stat.d {

        margin: 14px 0;
      }
      .box .h {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: var(--gray);
        margin-bottom: 6px;

      .box.c {
        border-left-color: var(--clay);
      }
      .box.c .h {

      .box.m {
        border-left-color: var(--mineral);
      }
      .box.m .h {
        color: var(--mineral-d);
      }
      .box.s {
        border-left-color: var(--sky);
      }
      .box.s .h {
        color: var(--sky-d);

        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.04em;
        padding: 3px 8px;
        border-radius: 4px;
        white-space: nowrap;
        vertical-align: middle;
      }
      .chip.c {
        background: #d9775722;
        color: var(--clay-d);
      }
      .chip.m {
        background: #62998722;
        color: var(--mineral-d);
      }
      .chip.s {
        background: #6a9bcc22;
        color: var(--sky-d);

        color: var(--gray);

        height: 5px;

        background: var(--oat);

        top: 9px;
        height: 5px;

        height: 5px;
        border-radius: 3px;

        vertical-align: middle;

        align-items: stretch;
        margin: 10px 0 6px;

        height: 100%;

        font-size: 13px;
        color: #cfccc2;
        line-height: 1.5;
      }

        outline: 2px solid var(--clay);

        margin-bottom: 6px;
        color: var(--ink2);

        border-top: 1px solid var(--line);

        color: var(--gray);
        font-size: 13px;

        .trow {

    <script id="story" type="application/json">
      {}
    </script>
    <script>
      // D: the recorded run (tutor report-data). S: the narrative Claude wrote (tutor/state/story.json). Numbers come only from D.
      const D = JSON.parse(document.getElementById("data").textContent);
      const S = JSON.parse(document.getElementById("story").textContent);
      const $ = (tag, cls, html) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html != null) e.innerHTML = html;
        return e;
      };
      const esc = (s) =>
        String(s == null ? "" : s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      const root = document.getElementById("root");
      let secNo = 0;
      function section(title, build) {
        const s = $("section");
        secNo++;
        s.appendChild(
          $(
            "h2",
            null,
            `<span class="num">${String(secNo).padStart(2, "0")}</span>${esc(title)}`,
          ),
        );
        build(s);
        root.appendChild(s);
      }
      const list = (items) =>
        `<ul class="plain">${items.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
      const notes = D.state.notes || {},
        tl = D.timeline || [],
        steps = D.state.steps || [];
      const activeMin = Math.round(
        tl.reduce((a, r) => a + (r.actualMinutes || 0), 0),
      );
      const fmtT = (iso) =>
        iso
          ? new Date(iso).toLocaleTimeString("ja-JP", {
              hour: "2-digit",
              minute: "2-digit",
            })
          : "";
      const budget = D.state.budgetMinutes || 90;

      // masthead
      document.getElementById("h1").textContent =
        S.headline || "今日あなたがやったこと";
      document.getElementById("sub").textContent =
        S.summary ||
        "RFP への応札から、受注した案件の最初の改修とコードレビューまで。";
      const started = D.state.startedAt ? new Date(D.state.startedAt) : null;
      const doneN =
        steps.filter((x) => x.status === "done").length +
        (D.state.current &&
        D.state.current === (steps[steps.length - 1] || {}).id
          ? 1
          : 0);
      document.getElementById("hmeta").innerHTML = [
        [
          "日付",
          started
            ? started.toLocaleDateString("ja-JP", {
                year: "numeric",
                month: "long",
                day: "numeric",
              })
            : "",
        ],
        [
          "案件",
          "Meridian Components · 在庫ダッシュボード（RFP MC-2026-0417）",
        ],
        [
          "完了したステップ",
          `${steps.length} 中 ${Math.min(doneN, steps.length)}`,
        ],
        ["ステップにかけた時間", `${activeMin} 分 / 予算 ${budget} 分`],
      ]
        .map(
          ([k, v]) =>
            `<div><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`,
        )
        .join("");

      // 01 summary
      section("概要", (s) => {
        const commits = (D.git && D.git.commits) || [];
        const t = D.tests || {};
        const deliv = (D.deliverables || []).filter(
          (f) => f.name !== "progress-report.html",
        );
        const stats = $("div", "stats");
        stats.innerHTML = `
    <div class="stat c"><div class="v">${deliv.length}</div><div class="k">成果物（proposal/）<br>提案書・ページ・スライド・メモ</div></div>
    <div class="stat m"><div class="v">${commits.length}</div><div class="k">納品したコミット<br>（client/ と server/）</div></div>
    <div class="stat s"><div class="v">${t.passed != null ? `${esc(t.passed)} <small>/ ${esc(t.passed + (t.failed || 0))}</small>` : "—"}</div><div class="k">バックエンドのテスト（成功 / 全体）<br>${t.failed ? `失敗 ${esc(t.failed)} 件（元から ${esc(t.baselineFailed)} 件）` : ""}</div></div>
    <div class="stat d"><div class="v">${activeMin} <small>分</small></div><div class="k">ステップにかけた時間<br>予算 ${budget} 分</div></div>`;
        s.appendChild(stats);
        if (S.takeaway) {
          const b = $("div", "box c");
          b.innerHTML = `<div class="h">一言でまとめると</div><p>${esc(S.takeaway)}</p>`;
          s.appendChild(b);
        }
      });

      // 02 timeline
      section("タイムライン — 予定と実績", (s) => {
        const max = Math.max(
          1,
          ...tl.map((r) =>
            Math.max(r.plannedMinutes || 0, r.actualMinutes || 0),
          ),
        );
        const box = $("div", "tl");
        let part = null;
        const partOf = (id) => (steps.find((x) => x.id === id) || {}).part;
        const partTitle = (p) =>
          ((D.state.parts || []).find((x) => x.id === p) || {}).title || "";
        tl.forEach((r) => {
          const p = partOf(r.id);
          if (p !== part) {
            part = p;
            box.appendChild($("div", "phead", esc(partTitle(p))));
          }
          const n = steps.findIndex((x) => x.id === r.id);
          const row = $("div", "trow");
          row.innerHTML = `<span class="n">${String(n).padStart(2, "0")}</span><span class="t">${esc(r.title)} ${r.forced ? '<span class="chip n">時間の都合で先へ</span>' : ""}<br><small>${fmtT(r.startedAt)}</small></span>
      <span class="bars"><i style="width:${(100 * (r.plannedMinutes || 0)) / max}%"></i><b style="width:${(100 * (r.actualMinutes || 0)) / max}%"></b></span>
      <span class="m">${r.actualMinutes ?? "—"} / ${r.plannedMinutes} 分</span>`;
          box.appendChild(row);
        });
        s.appendChild(box);
        s.appendChild(
          $(
            "div",
            "legend",
            '<span class="a">予定の時間</span><span class="b">実際にかかった時間</span>',
          ),
        );
        if (S.timelineNote) s.appendChild($("p", null, esc(S.timelineNote)));
      });

      // 03 Act 1: the proposal
      section("第1幕 — 提案書", (s) => {
        if (S.proposalNote) s.appendChild($("p", null, esc(S.proposalNote)));
        const rows = [
          ["見つけた RFP の穴", notes.gaps],
          ["提案の方針（あなたの判断）", notes.decisions],
          ["前提条件", notes.assumptions],
        ].filter((r) => r[1]);
        if (rows.length) {
          const t = $("table");
          t.innerHTML = `<tbody>${rows.map((r) => `<tr><th style="width:26%">${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join("")}</tbody>`;
          s.appendChild(t);
        }
        const deliv = (D.deliverables || []).filter(
          (f) => f.name !== "progress-report.html",
        );
        if (deliv.length) {
          const f = $("div", "files");
          deliv.forEach((d) => {
            const a = $(
              "a",
              "file",
              `<div class="p">proposal/${esc(d.name)}</div><div class="d">${d.kind === "md" ? "Markdown（整形して表示）" : "HTML"}</div>`,
            );
            a.href = d.url;
            a.target = "_blank";
            f.appendChild(a);
          });
          s.appendChild(f);
        }
      });

      // 04 Act 2: what was delivered
      section("第2幕 — 納品したもの", (s) => {
        const changes =
          S.changes && S.changes.length
            ? S.changes
            : ((D.git && D.git.commits) || []).map((c) => ({
                title: c.subject,
                commit: c.hash,
              }));
        if (notes.reports_issue) {
          const b = $("div", "box s");
          b.innerHTML = `<div class="h">アプリを起動して、あなたが気づいたこと</div><p>${esc(notes.reports_issue)}</p>`;
          s.appendChild(b);
        }
        const cards = $("div", "cards");
        changes.forEach((c) => {
          const card = $("div", "card");
          card.innerHTML = `<div class="meta">${c.area ? `<span class="chip c">${esc(c.area)}</span>` : ""}${c.commit ? `<span class="chip k">${esc(String(c.commit).slice(0, 7))}</span>` : ""}</div><h3>${esc(c.title || "")}</h3>${c.what ? `<p>${esc(c.what)}</p>` : ""}${c.check ? `<div class="check"><span class="chip m">確認</span>${esc(c.check)}</div>` : ""}`;
          cards.appendChild(card);
        });
        s.appendChild(cards);
        if ((D.git || {}).stat)
          s.appendChild($("p", null, `合計: <code>${esc(D.git.stat)}</code>`));
      });

      // 05 code review: every finding, why it mattered, what the learner chose, and what the fix changed.
      // Detailed form: review.findings [{ severity, title, where, problem, decision, reason, fix }];
      // older story files with review.fixed / review.deferred (plain lists) still render.
      section("コードレビュー", (s) => {
        const r = S.review || {};
        if (r.note) s.appendChild($("p", null, esc(r.note)));
        const f = r.findings || [];
        if (f.length) {
          const is = (x, re) => re.test(x.decision || "");
          const fixed = f.filter((x) => is(x, /修正|fix/i)), later = f.filter((x) => is(x, /次|later|defer/i)), skip = f.filter((x) => !is(x, /修正|fix/i) && !is(x, /次|later|defer/i));
          const stats = $("div", "stats");
          stats.innerHTML = `<div class="stat d"><div class="v">${f.length}</div><div class="k">見つかった指摘</div></div><div class="stat m"><div class="v">${fixed.length}</div><div class="k">修正した${r.fixCommit ? `<br><span class="chip k">${esc(String(r.fixCommit).slice(0, 7))}</span>` : ""}</div></div><div class="stat s"><div class="v">${later.length}</div><div class="k">次フェーズに回した</div></div><div class="stat"><div class="v">${skip.length}</div><div class="k">見送った</div></div>`;
          s.appendChild(stats);
          const dc = (x) => (is(x, /修正|fix/i) ? "m" : is(x, /次|later|defer/i) ? "s" : "n");
          const t = $("table");
          t.innerHTML = `<thead><tr><th style="width:6%">重要度</th><th style="width:30%">指摘と場所</th><th>何が問題か</th><th style="width:28%">判断と対応</th></tr></thead><tbody>${f
            .map((x) => `<tr><td style="font-size:18px">${esc(x.severity || "")}</td><td><b>${esc(x.title)}</b>${x.where ? `<br><code>${esc(x.where)}</code>` : ""}</td><td>${esc(x.problem || "")}</td><td><span class="chip ${dc(x)}">${esc(x.decision || "—")}</span>${x.reason ? ` ${esc(x.reason)}` : ""}${x.fix ? `<br><small>修正: ${esc(x.fix)}</small>` : ""}</td></tr>`)
            .join("")}</tbody>`;
          s.appendChild(t);
        } else if ((r.fixed || []).length || (r.deferred || []).length) {
          const g = $("div", "pairs");
          const b1 = $("div", "box m"); b1.innerHTML = `<div class="h">直した指摘</div>${(r.fixed || []).length ? list(r.fixed) : "<p>なし</p>"}`;
          const b2 = $("div", "box"); b2.innerHTML = `<div class="h">次フェーズに回した指摘</div>${(r.deferred || []).length ? list(r.deferred) : "<p>なし</p>"}`;
          g.appendChild(b1); g.appendChild(b2); s.appendChild(g);
        } else if (notes.review) { const b = $("div", "box m"); b.innerHTML = `<div class="h">レビューの記録</div><p>${esc(notes.review)}</p>`; s.appendChild(b); }
      });

      // 06 decisions and corrections
      section("あなたが決めたことと、Claude を軌道修正した場面", (s) => {
        const group = (title, items, cls) => {
          s.appendChild($("h3", "sub", esc(title)));
          if (!items.length) {
            s.appendChild($("p", null, "記録はありません。"));
            return;
          }
          const g = $("div", "pairs");
          items.forEach((d) => {
            const b = $("div", `box ${cls}`);
            b.innerHTML = `<div class="h">${esc(d.title)}</div><p>${esc(d.detail)}</p>`;
            g.appendChild(b);
          });
          s.appendChild(g);
        };
        group("あなたが決めたこと", S.decisions || [], "c");
        group("Claude を軌道修正した場面", S.corrections || [], "");
      });

      // 07 next phase (the handover to the client)
      // 07 next phase: the detailed handover of everything Part 2 did not cover, grouped by requirement.
      // Each item: { req, title, status, evidence, action, priority (高/中/低), estimate, question? }.
      // Older story files with only { title, detail } still render (detail goes into the status column).
      section("次フェーズへの引き継ぎ", (s) => {
        const np = S.nextPhase || [];
        const h = S.handover || {};
        if (h.note) s.appendChild($("p", null, esc(h.note)));
        if (!np.length) { s.appendChild($("p", null, "記録はありません。")); return; }
        const pr = (p) => (/高|high/i.test(p || "") ? "c" : /中|mid|medium/i.test(p || "") ? "s" : "n");
        const count = (re) => np.filter((x) => re.test(x.priority || "")).length;
        s.appendChild($("p", "muted", `未対応の課題 ${np.length} 件（優先度 高 ${count(/高|high/i)} · 中 ${count(/中|mid|medium/i)} · 低 ${count(/低|low/i)}）`));
        const groups = [];
        np.forEach((x) => { const g = x.req || "その他"; let e = groups.find((y) => y.g === g); if (!e) groups.push((e = { g, items: [] })); e.items.push(x); });
        groups.forEach(({ g, items }) => {
          s.appendChild($("h3", "sub", esc(g)));
          const t = $("table");
          t.innerHTML = `<thead><tr><th style="width:18%">課題</th><th>現状（確認した根拠）</th><th>推奨対応</th><th style="width:12%">優先度 · 目安</th></tr></thead><tbody>${items
            .map((x) => `<tr><td><b>${esc(x.title)}</b></td><td>${esc(x.status || x.detail || "")}${x.evidence ? `<br><code>${esc(x.evidence)}</code>` : ""}</td><td>${esc(x.action || "")}${x.question ? `<br><span class="chip s">要確認</span> ${esc(x.question)}` : ""}</td><td>${x.priority ? `<span class="chip ${pr(x.priority)}">${esc(x.priority)}</span>` : ""}${x.estimate ? `<br><small>${esc(x.estimate)}</small>` : ""}</td></tr>`)
            .join("")}</tbody>`;
          s.appendChild(t);
        });
        if (h.schedule) { const b = $("div", "box s"); b.innerHTML = `<div class="h">提案書のスケジュールとの対応</div><p>${esc(h.schedule)}</p>`; s.appendChild(b); }
        if ((h.questions || []).length) { const b = $("div", "box c"); b.innerHTML = `<div class="h">クライアントに確認したいこと</div>${list(h.questions)}`; s.appendChild(b); }
      });

      // 08 features
      if ((S.features || []).length)
        section("使った機能と、それを操作したのは誰か", (s) => {
          const t = $("table");
          t.innerHTML = `<thead><tr><th>機能</th><th>操作したのは</th><th>今日、何の役に立ったか</th></tr></thead><tbody>${S.features.map((f) => `<tr><td><code>${esc(f.name)}</code></td><td><span class="chip ${/you|あなた/i.test(f.who) ? "c" : "m"}">${esc(f.who)}</span></td><td>${esc(f.note)}</td></tr>`).join("")}</tbody>`;
          s.appendChild(t);
        });

      // 09 not covered
      section("今日は扱わなかったもの", (s) => {
        const nc =
          S.notCovered && S.notCovered.length
            ? S.notCovered
            : [
                "MCP（Playwright による E2E テスト）",
                "hooks",
                "worktree",
                "GitHub への push と PR",
                "R3 発注推奨ビュー",
              ];
